<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Bleu – Temperament Analysis</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230a1a6b'/%3E%3Ctext x='32' y='42' font-family='Arial' font-size='28' font-weight='bold' fill='white' text-anchor='middle'%3EAB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,500;0,700;1,700;1,800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

</head>
<body>

<div class="wrap">

  <!-- Intro -->
  <section id="intro" class="intro">
    <div class="logo"><svg role="img" aria-label="Agent Bleu – I will tell you"><use href="#ab-logo"/></svg></div>
    <h1>Answer a few questions. Agent Bleu reads your temperament.</h1>
    <p>Each question has no right or wrong answer. Pick the response closest to your first instinct.</p>
    <button class="btn" id="start">Start analysis</button>
  </section>

  <!-- Questionnaire -->
  <section id="quiz" hidden>
    <div class="bar">
      <div class="logo"><svg role="img" aria-label="Agent Bleu"><use href="#ab-mark"/></svg></div>
      <div class="meta">
        <div class="track" id="track" aria-hidden="true"></div>
        <div class="count" id="count" aria-live="polite"></div>
      </div>
    </div>
    <div id="notice"></div>
    <h2 class="q-text" id="qtext"></h2>
    <div class="options" id="options" role="radiogroup" aria-labelledby="qtext"></div>
    <div class="actions">
      <button class="btn ghost" id="back">Back</button>
      <button class="btn" id="next" disabled>Next question</button>
    </div>
    <p class="note">Tip: press 1–4 to choose, Enter to continue.</p>
  </section>

  <!-- Result -->
  <section id="result" class="result" hidden>
    <div class="bar"><div class="logo"><svg role="img" aria-label="Agent Bleu"><use href="#ab-mark"/></svg></div></div>
    <p class="count">Your dominant temperament</p>
    <h2 id="rname"></h2>
    <p class="lead" id="rsummary"></p>
    <div class="scores" id="scores"></div>
    <button class="btn ghost" id="restart">Retake analysis</button>
  </section>
</div>

<script>
/* ================== CONFIG – adjust to your Go backend ==================
   GET  {API_BASE}/questions/stream
        Streamed as SSE (data: {...}) or NDJSON (one JSON object per line).
        Events, in the order they are produced:
          {type:"question", id, text}            start a question (text may be "")
          {type:"question", id, delta}           append a chunk to its text
          {type:"option", question_id, id, text} add an option (or {delta} to append)
          {type:"done"}                          no more questions
   POST {API_BASE}/analyze  -> body {answers:[{question_id, option_id}]}
                            <- {dominant, summary, scores:{Sanguine:0-100,...}}
   If the stream can't be opened, a simulated stream of demo questions is used
   so the UI can be developed without the backend.                         */
const API_BASE = '/api/v1';

const LOCAL_QUESTIONS = [
  {id:1,text:'When faced with a sudden, unexpected change in your plans, what is your immediate reaction?',options:[
    {id:'a',text:'I adapt immediately; chaos is just a new pattern.',w:{Sanguine:2,Choleric:1}},
    {id:'b',text:'I feel a spike of frustration, but I work out the next step.',w:{Choleric:2,Melancholic:1}},
    {id:'c',text:'I feel anxious and need a moment to process the disruption.',w:{Melancholic:2}},
    {id:'d',text:'I ignore it and stick to my original plan as long as possible.',w:{Phlegmatic:2}}]},
  {id:2,text:'At a gathering where you know almost nobody, what do you usually do?',options:[
    {id:'a',text:'Start conversations and make friends within minutes.',w:{Sanguine:2}},
    {id:'b',text:'Find the person in charge and get to the point.',w:{Choleric:2}},
    {id:'c',text:'Observe first, then talk to one or two people closely.',w:{Melancholic:2}},
    {id:'d',text:'Stay near the edge and let people come to me.',w:{Phlegmatic:2}}]},
  {id:3,text:'You are given a long project with no deadline. How do you work?',options:[
    {id:'a',text:'I start with energy, but need variety to keep going.',w:{Sanguine:2}},
    {id:'b',text:'I set my own deadline and push hard to finish.',w:{Choleric:2}},
    {id:'c',text:'I plan every detail and check my work repeatedly.',w:{Melancholic:2}},
    {id:'d',text:'I work steadily at a calm, even pace.',w:{Phlegmatic:2}}]},
  {id:4,text:'A friend criticises something you did. What happens inside?',options:[
    {id:'a',text:'It stings briefly, then I move on.',w:{Sanguine:2}},
    {id:'b',text:'I defend my choice and challenge their view.',w:{Choleric:2}},
    {id:'c',text:'I replay it for days and wonder what I got wrong.',w:{Melancholic:2}},
    {id:'d',text:'I stay calm and avoid making it a conflict.',w:{Phlegmatic:2}}]}
];
const SUMMARIES = {
  Sanguine:'Expressive, optimistic and quick to connect. You recharge around people and bring energy to a room.',
  Choleric:'Driven, decisive and direct. You set goals fast and move others toward them.',
  Melancholic:'Thoughtful, precise and deeply reflective. You notice detail and hold high standards.',
  Phlegmatic:'Calm, steady and dependable. You keep your balance when others lose theirs.'
};

/* ================== App ================== */
const $ = id => document.getElementById(id);
let questions = [], answers = {}, index = 0, streamDone = false, runId = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));

function show(id){ ['intro','quiz','result'].forEach(s => $(s).hidden = s !== id); window.scrollTo(0,0); }

/* ---- stream handling ---- */
function handleEvent(ev){
  if(ev.type === 'question'){
    let q = questions.find(q => String(q.id) === String(ev.id));
    if(!q){ q = {id:ev.id, text:'', options:[]}; questions.push(q); }
    q.text += (ev.delta ?? ev.text ?? '');
  }else if(ev.type === 'option'){
    const q = questions.find(q => String(q.id) === String(ev.question_id));
    if(!q) return;
    let o = q.options.find(o => String(o.id) === String(ev.id));
    if(!o){ o = {id:ev.id, text:''}; q.options.push(o); }
    o.text += (ev.delta ?? ev.text ?? '');
    if(ev.w) o.w = ev.w;
  }else if(ev.type === 'done'){
    streamDone = true;
  }else return;
  render();
}

async function readStream(res, onEvent){
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '';
  const flush = line => {
    line = line.trim();
    if(!line || line[0] === ':' || line.startsWith('event:') || line.startsWith('id:')) return;
    if(line.startsWith('data:')) line = line.slice(5).trim();
    if(line === '[DONE]') return onEvent({type:'done'});
    try{ onEvent(JSON.parse(line)); }catch(e){ /* ignore malformed line */ }
  };
  for(;;){
    const {value, done} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    const lines = buf.split('\n'); buf = lines.pop();
    lines.forEach(flush);
  }
  if(buf) flush(buf);
  onEvent({type:'done'});
}

async function demoStream(on){
  for(const q of LOCAL_QUESTIONS){
    on({type:'question', id:q.id, text:''});
    for(const w of q.text.split(' ')){ on({type:'question', id:q.id, delta:w + ' '}); await wait(35); }
    for(const o of q.options){ on({type:'option', question_id:q.id, id:o.id, text:o.text, w:o.w}); await wait(160); }
  }
  on({type:'done'});
}

async function openStream(){
  const id = ++runId;
  const on = ev => { if(id === runId) handleEvent(ev); };
  try{
    const r = await fetch(API_BASE + '/questions/stream', {headers:{Accept:'text/event-stream, application/x-ndjson'}});
    if(!r.ok || !r.body) throw new Error(r.status);
    await readStream(r, on);
  }catch(e){
    if(id !== runId) return;
    if(!questions.length){
      $('notice').innerHTML = '<div class="err">Could not reach the Agent Bleu server. Showing demo questions instead.</div>';
      await demoStream(on);
    }else{
      $('notice').innerHTML = '<div class="err">The connection was interrupted. You can continue with the questions received so far.</div>';
      on({type:'done'});
    }
  }
}

/* ---- rendering ---- */
function render(){
  const q = questions[index];
  if(!q) return;
  const last = index === questions.length-1;
  $('qtext').textContent = q.text.trim();
  $('qtext').classList.toggle('streaming', last && !streamDone);
  $('count').textContent = (index+1) + ' of ' + (streamDone ? questions.length : '…');
  $('track').innerHTML = questions.map((_,i) => '<i class="' + (i <= index ? 'done' : '') + '"></i>').join('');
  $('options').innerHTML = '';
  q.options.forEach((o,i) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.setAttribute('role','radio');
    b.setAttribute('aria-checked', String(answers[q.id] === o.id));
    b.innerHTML = '<kbd>' + (i+1) + '</kbd><span></span>';
    b.lastChild.textContent = o.text.trim();
    b.onclick = () => choose(o.id);
    $('options').appendChild(b);
  });
  $('back').style.visibility = index ? 'visible' : 'hidden';
  const waiting = last && !streamDone;
  $('next').disabled = !answers[q.id] || waiting;
  $('next').textContent = waiting ? (answers[q.id] ? 'Waiting for next question…' : 'Next question')
                        : last ? 'See my result' : 'Next question';
}

function choose(optId){
  answers[questions[index].id] = optId;
  render();
  if(!$('next').disabled) $('next').focus();
}

async function next(){
  if(index < questions.length-1){ index++; render(); return; }
  if(!streamDone) return;
  $('next').disabled = true; $('next').textContent = 'Analysing…';
  let data;
  try{
    const r = await fetch(API_BASE + '/analyze', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({answers: Object.entries(answers).map(([question_id,option_id]) => ({question_id, option_id}))})
    });
    if(!r.ok) throw new Error(r.status);
    data = await r.json();
  }catch(e){
    data = analyseLocally();
  }
  showResult(data);
}

function analyseLocally(){
  const t = {Sanguine:0,Choleric:0,Melancholic:0,Phlegmatic:0};
  questions.forEach(q => {
    const o = q.options.find(o => o.id === answers[q.id]);
    if(o && o.w) for(const k in o.w) t[k] += o.w[k];
  });
  const max = Math.max(1, ...Object.values(t));
  const scores = {}; for(const k in t) scores[k] = Math.round(t[k]/max*100);
  const dominant = Object.keys(t).sort((a,b) => t[b]-t[a])[0];
  return {dominant, summary:SUMMARIES[dominant], scores};
}

function showResult(d){
  $('rname').textContent = d.dominant;
  $('rsummary').textContent = d.summary || SUMMARIES[d.dominant] || '';
  $('scores').innerHTML = Object.entries(d.scores).map(([k,v]) =>
    '<div class="score"><span>' + k + '</span><div class="meter"><b data-w="' + v + '"></b></div><span>' + v + '%</span></div>').join('');
  show('result');
  requestAnimationFrame(() => requestAnimationFrame(() =>
    document.querySelectorAll('.meter b').forEach(b => b.style.width = b.dataset.w + '%')));
}

$('start').onclick = () => {
  questions = []; answers = {}; index = 0; streamDone = false;
  $('notice').innerHTML = '';
  $('qtext').textContent = 'Connecting to Agent Bleu…';
  $('qtext').classList.add('streaming');
  $('options').innerHTML = ''; $('count').textContent = ''; $('track').innerHTML = '';
  $('back').style.visibility = 'hidden'; $('next').disabled = true; $('next').textContent = 'Next question';
  show('quiz');
  openStream();
};
$('next').onclick = next;
$('back').onclick = () => { if(index){ index--; render(); } };
$('restart').onclick = () => { runId++; show('intro'); };

document.addEventListener('keydown', e => {
  if($('quiz').hidden) return;
  const q = questions[index], n = parseInt(e.key,10);
  if(!q) return;
  if(n >= 1 && n <= q.options.length) choose(q.options[n-1].id);
  else if(e.key === 'Enter' && answers[q.id] && document.activeElement.tagName !== 'BUTTON') next();
});
</script>
</body>
</html>
